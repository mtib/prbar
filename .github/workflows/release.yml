name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create the release for (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-app.sh

      # ditto, not zip: it preserves the bundle's symlinks and extended attributes, which a
      # plain `zip -r` mangles.
      - name: Package
        id: package
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/prbar.app prbar.zip
          echo "sha256=$(shasum -a 256 prbar.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Menu bar app for GitHub PRs awaiting your review.

          ```sh
          brew tap mtib/tap
          brew install --cask mtib/tap/prbar
          xattr -dr com.apple.quarantine /Applications/prbar.app
          ```

          The `xattr` step is required: the build is ad-hoc signed, not notarized.
          EOF
          )
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" prbar.zip --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" prbar.zip \
              --title "${{ steps.version.outputs.tag }}" \
              --notes "$notes" \
              --latest
          fi

  update-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout tap repo
        uses: actions/checkout@v5
        with:
          repository: mtib/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      # The cask is rendered from a template rather than a heredoc so the backticks and #{}
      # interpolation in it survive untouched.
      - name: Render cask
        run: |
          sed -e "s/@@VERSION@@/${{ needs.release.outputs.version }}/" \
              -e "s/@@SHA256@@/${{ needs.release.outputs.sha256 }}/" \
              packaging/prbar.rb.tmpl > tap/Casks/prbar.rb
          grep -q '@@' tap/Casks/prbar.rb && { echo "unsubstituted placeholder left"; exit 1; } || true
          cat tap/Casks/prbar.rb

      - name: Commit and push cask
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/prbar.rb
          git diff --cached --quiet || git commit -m "prbar: update to ${{ needs.release.outputs.tag }}"
          git push
